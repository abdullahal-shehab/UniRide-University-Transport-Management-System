<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UniRide - Sign In to your account">
    <title>Sign In - UniRide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <div class="auth-page">
        <header class="auth-header">
            <a href="index.html" class="auth-header__logo" aria-label="UniRide Home">
                <svg class="auth-header__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 6L16 16L22 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>UniRide</span>
            </a>
        </header>

        <main class="auth-main">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
                        <button role="tab" id="tab-login" class="auth-tab auth-tab--active" aria-selected="true" aria-controls="panel-login" data-tab="login">Sign In</button>
                        <button role="tab" id="tab-register" class="auth-tab" aria-selected="false" aria-controls="panel-register" data-tab="register">Register</button>
                    </div>

                    <div class="auth-panels">
                        <div role="tabpanel" id="panel-login" class="auth-panel auth-panel--active" aria-labelledby="tab-login">
                            <form id="login-form" class="auth-form" novalidate>
                                <h2 class="auth-form__title">Welcome Back</h2>
                                <p class="auth-form__subtitle">Sign in to access your dashboard</p>

                                <div id="login-error" class="auth-alert auth-alert--error" role="alert" hidden></div>

                                <div class="form-group">
                                    <label for="login-email" class="form-label">Email Address</label>
                                    <input type="email" id="login-email" name="email" class="form-input" autocomplete="email" required placeholder="you@university.edu">
                                </div>

                                <div class="form-group">
                                    <label for="login-password" class="form-label">Password</label>
                                    <div class="form-input-wrapper">
                                        <input type="password" id="login-password" name="password" class="form-input" autocomplete="current-password" required placeholder="••••••••">
                                        <button type="button" class="form-input-toggle" aria-label="Toggle password visibility" data-target="login-password">
                                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-group form-group--inline">
                                    <label class="checkbox-wrapper">
                                        <input type="checkbox" id="login-remember" name="remember">
                                        <span class="checkbox-custom"></span>
                                        <span>Remember me</span>
                                    </label>
                                    <a href="#" class="link link--forgot" id="forgot-password-link">Forgot password?</a>
                                </div>

                                <button type="submit" class="btn btn--primary btn--block btn--large" id="login-submit">Sign In</button>
                            </form>

                            <div class="auth-divider"><span>Or continue with</span></div>

                            <div class="auth-providers">
                                <button type="button" class="btn btn--outline auth-provider" data-provider="google" disabled>
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                    <span>Google</span>
                                </button>
                                <button type="button" class="btn btn--outline auth-provider" data-provider="microsoft" disabled>
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#F25022" d="M12.52 0h7.48v7.48h-7.48z"/><path fill="#7FBA00" d="M0 7.48h7.48v7.48H0z"/><path fill="#00A4EF" d="M0 0h7.48v7.48H0z"/><path fill="#FFB900" d="M7.48 0h7.48v7.48H7.48z"/></svg>
                                    <span>Microsoft</span>
                                </button>
                            </div>
                        </div>

                        <div role="tabpanel" id="panel-register" class="auth-panel" aria-labelledby="tab-register" hidden>
                            <form id="register-form" class="auth-form" novalidate>
                                <h2 class="auth-form__title">Create Account</h2>
                                <p class="auth-form__subtitle">Join UniRide for smarter campus travel</p>

                                <div id="register-error" class="auth-alert auth-alert--error" role="alert" hidden></div>

                                <div class="form-group">
                                    <label for="register-role" class="form-label">I am a</label>
                                    <select id="register-role" name="role" class="form-select" required>
                                        <option value="">Select your role</option>
                                        <option value="student">Student</option>
                                        <option value="faculty">Faculty</option>
                                    </select>
                                </div>

                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="register-firstName" class="form-label">First Name</label>
                                        <input type="text" id="register-firstName" name="firstName" class="form-input" autocomplete="given-name" required placeholder="John">
                                    </div>
                                    <div class="form-group">
                                        <label for="register-lastName" class="form-label">Last Name</label>
                                        <input type="text" id="register-lastName" name="lastName" class="form-input" autocomplete="family-name" required placeholder="Doe">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="register-email" class="form-label">University Email</label>
                                    <input type="email" id="register-email" name="email" class="form-input" autocomplete="email" required placeholder="john.doe@university.edu">
                                </div>

                                <div class="form-group">
                                    <label for="register-studentId" class="form-label">Student/Staff ID</label>
                                    <input type="text" id="register-studentId" name="studentId" class="form-input" autocomplete="username" required placeholder="2023100000384">
                                </div>

                                <div class="form-group">
                                    <label for="register-password" class="form-label">Password</label>
                                    <div class="form-input-wrapper">
                                        <input type="password" id="register-password" name="password" class="form-input" autocomplete="new-password" required placeholder="••••••••" minlength="8">
                                        <button type="button" class="form-input-toggle" aria-label="Toggle password visibility" data-target="register-password">
                                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                        </button>
                                    </div>
                                    <div class="form-hint">At least 8 characters</div>
                                </div>

                                <div class="form-group">
                                    <label for="register-confirmPassword" class="form-label">Confirm Password</label>
                                    <div class="form-input-wrapper">
                                        <input type="password" id="register-confirmPassword" name="confirmPassword" class="form-input" autocomplete="new-password" required placeholder="••••••••">
                                        <button type="button" class="form-input-toggle" aria-label="Toggle password visibility" data-target="register-confirmPassword">
                                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="checkbox-wrapper checkbox-wrapper--required">
                                        <input type="checkbox" id="register-terms" name="terms" required>
                                        <span class="checkbox-custom"></span>
                                        <span>I agree to the <a href="#" class="link">Terms of Service</a> and <a href="#" class="link">Privacy Policy</a></span>
                                    </label>
                                </div>

                                <button type="submit" class="btn btn--primary btn--block btn--large" id="register-submit">Create Account</button>
                            </form>

                            <div class="auth-divider"><span>Or continue with</span></div>

                            <div class="auth-providers">
                                <button type="button" class="btn btn--outline auth-provider" data-provider="google" disabled>
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                    <span>Google</span>
                                </button>
                                <button type="button" class="btn btn--outline auth-provider" data-provider="microsoft" disabled>
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#F25022" d="M12.52 0h7.48v7.48h-7.48z"/><path fill="#7FBA00" d="M0 7.48h7.48v7.48H0z"/><path fill="#00A4EF" d="M0 0h7.48v7.48H0z"/><path fill="#FFB900" d="M7.48 0h7.48v7.48H7.48z"/></svg>
                                    <span>Microsoft</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <p class="auth-footer">
                        <span id="auth-footer-text">Don't have an account? </span>
                        <a href="#" class="link link--switch" id="switch-to-register">Register</a>
                        <span id="auth-footer-text-login" hidden>Already have an account? </span>
                        <a href="#" class="link link--switch" id="switch-to-login" hidden>Sign In</a>
                    </p>
                </div>
            </div>
        </main>

        <footer class="auth-footer">
            <p>&copy; 2026 UniRide. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
